# =============================================================================
# docker-compose.scale.yml — Override OPT-IN para escalar el POS horizontalmente
# (Fase P3, docs/P3_HORIZONTAL_SCALING_DESIGN.md §3.1/§3.2).
#
# Agrega una 2ª réplica del POS (`tuwayki_sys_2`), idéntica a `tuwayki_sys` vía
# `extends` (misma imagen/env/red → sin drift), con volúmenes .web/.bun propios.
# Ambas quedan en `npm_network` con hostnames estables `tuwayki_sys` /
# `tuwayki_sys_2`, para que NPM balancee entre ellas con sticky (ip_hash).
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d
#
# ⚠️ Requiere ADEMÁS la config de NPM (upstream ip_hash) — ver el runbook
#    docs/P3_STEP3_REPLICAS_RUNBOOK.md. Sin ella, NPM sigue apuntando a una sola
#    instancia y la 2ª réplica no recibe tráfico.
#
# Aritmética de conexiones: con 2 réplicas de sys → (landing+admin+sys+sys_2) = 4
#   × 25 conns = 100 < max_connections=200. OK con amplio margen.
# =============================================================================

services:
  tuwayki_sys_2:
    extends:
      file: docker-compose.yml
      service: tuwayki_sys
    container_name: tuwayki_sys_2
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Volúmenes propios: cada réplica compila su .web / cachea su .bun por separado.
    volumes:
      - reflex_web_sys_2:/app/.web
      - bun_cache_sys_2:/app/.bun

volumes:
  reflex_web_sys_2:
  bun_cache_sys_2:
