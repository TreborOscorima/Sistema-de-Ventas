# Prometheus — scrape de infraestructura TUWAYKI (Fase P3 §3.5).
# Liviano: 30s de intervalo, retención corta (se define en el compose).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: prod

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # El propio Prometheus.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host: CPU / RAM / disco / red.
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  # Contenedores: CPU / RAM por contenedor (para ver headroom y OOM).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # MySQL: conexiones, buffer pool, slow queries, InnoDB.
  - job_name: mysql
    static_configs:
      - targets: ["mysqld_exporter:9104"]

  # Disponibilidad de las 3 superficies (probe HTTP a /api/health vía blackbox).
  - job_name: app_health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://sys.tuwayki.app/api/health
          - https://admin.tuwayki.app/api/health
          - https://tuwayki.app/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
